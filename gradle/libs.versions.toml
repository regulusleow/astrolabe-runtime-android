[versions]
agp = "9.3.0"
astrolabe-protocol = "2.0.0"
constraintlayout = "2.2.2"
androidx-test-ext = "1.3.0"
espresso = "3.7.0"
junit = "4.13.2"
maven-publish = "0.37.0"

[libraries]
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
astrolabe-protocol-kotlin = { module = "io.github.regulusleow:astrolabe-protocol-kotlin", version.ref = "astrolabe-protocol" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
junit = { module = "junit:junit", version.ref = "junit" }
maven-publish-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "maven-publish" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
