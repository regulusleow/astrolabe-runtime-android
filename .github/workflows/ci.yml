name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ORG_GRADLE_PROJECT_astrolabeUseMavenLocal: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check out Protocol
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: regulusleow/astrolabe-protocol
          ref: 2.0.0
          path: astrolabe-protocol
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Publish Protocol to Maven Local
        working-directory: astrolabe-protocol
        run: ./gradlew :AstrolabeProtocolKotlin:publishToMavenLocal
      - name: Test release tools
        run: |
          npm ci
          npm test
      - name: Verify modules and publication
        run: >
          ./gradlew
          verifyModuleBoundaries
          :astrolabe-runtime-distribution:verifyDistributionArtifact
      - name: Test and lint
        run: ./gradlew test lint
      - name: Build variants
        run: ./gradlew assembleDebug assembleRelease

  instrumentation:
    name: Instrumentation API ${{ matrix.api-level }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [23, 29, 36]
    env:
      ORG_GRADLE_PROJECT_astrolabeUseMavenLocal: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check out Protocol
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: regulusleow/astrolabe-protocol
          ref: 2.0.0
          path: astrolabe-protocol
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Publish Protocol to Maven Local
        working-directory: astrolabe-protocol
        run: ./gradlew :AstrolabeProtocolKotlin:publishToMavenLocal
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build instrumentation APKs
        run: >
          ./gradlew
          :astrolabe-runtime-view:assembleDebug
          :astrolabe-runtime-view:assembleDebugAndroidTest
      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: >
            ./gradlew
            --no-configuration-cache
            :astrolabe-runtime-view:connectedDebugAndroidTest
