name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: maven-central
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify tagged commit belongs to main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Install release tools
        run: npm ci
      - name: Test release tools
        run: npm test
      - name: Verify public Protocol dependency
        run: >
          ./gradlew
          --no-configuration-cache
          :astrolabe-runtime-distribution:verifyDistributionArtifact
      - name: Prepare signing home
        run: |
          signing_home="$RUNNER_TEMP/astrolabe-gnupg"
          mkdir -p "$signing_home"
          chmod 700 "$signing_home"
          echo "GNUPGHOME=$signing_home" >> "$GITHUB_ENV"
      - name: Import signing key
        env:
          MAVEN_GPG_PRIVATE_KEY_BASE64: ${{ secrets.MAVEN_GPG_PRIVATE_KEY_BASE64 }}
        run: |
          test -n "$MAVEN_GPG_PRIVATE_KEY_BASE64"
          printf '%s' "$MAVEN_GPG_PRIVATE_KEY_BASE64" \
            | base64 --decode \
            | gpg --batch --import
      - name: Publish to Maven Central
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_SIGNING_KEY_ID: ${{ secrets.MAVEN_SIGNING_KEY_ID }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: npm run release:central
      - name: Clean signing home
        if: always()
        run: |
          test -n "${GNUPGHOME:-}"
          rm -rf -- "$GNUPGHOME"
